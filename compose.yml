services:

  mandalorian:
    build: dnsserver
    hostname: mandalorian
    command: ["-f","-4"]
    networks:
      rededns:
        ipv4_address: 192.168.20.20
    volumes:
      - ./mandalorian/named.conf.options:/etc/bind/named.conf.options
      - ./logs/query.log:/var/log/named/query.log
      #- ./mandalorian/named.conf.root-hints:/etc/bind/named.conf.root-hints

  darthvader:
    build: dnsserver
    hostname: darthvader
    command: -g -4 -u root
    volumes:
      #- ./darthvader/named.conf.options:/etc/bind/named.conf.options
      - ./darthvader/named.conf.local:/etc/bind/named.conf.local
      - ./darthvader/zonas/db.starwars.lan:/etc/bind/db.starwars.lan
      - ./darthvader/zonas/db.192:/etc/bind/db.192
      #- ./darthvader/zonas:/var/cache/bind
      #- ./dnsserver/root.hints:/usr/share/dns/root.hints
      #- ./darthvader/named.conf.default-zones:/etc/bind/named.conf.default-zones
      #- ./logs:/logs
    networks:
      rededns:
        ipv4_address: 192.168.20.10

  darthsidious:
    build: dnsserver
    hostname: darthsidious
    depends_on:
      - darthvader
    networks:
      rededns:
        ipv4_address: 192.168.20.11
    volumes:
      - ./darthsidious/named.conf.local:/etc/bind/named.conf.local


  cliente:
    build: cliente
    hostname: cliente1
    depends_on:
      - darthvader
    networks:
      rededns:
        ipv4_address: 192.168.20.112
    # volumes:
    #   - ./cliente/rndc.conf:/etc/bind/rndc.conf
    #   - ./cliente/chave.key:/etc/bind/chave.key
    #   - ./cliente/actualiza.txt:/etc/bind/actualiza.txt
    dns: 
    - 192.168.20.10
    - 192.168.20.11

  delegado:
    build: dnsserver
    hostname: delegado
    depends_on:
      - darthvader
      - mandalorian
    networks:
      rededns:
        ipv4_address: 192.168.20.8
    volumes:
      - ./delegado/named.conf.local:/etc/bind/named.conf.local
      - ./delegado/zonas/db.outrotest.starwars.lan:/var/cache/bind/db.starwars.lan



networks:
  rededns:
    ipam:
      config:
        - subnet: 192.168.20.0/24


